# case G1 · kb 先行 · serves: FR-2
case: G1
checks:
  - path: requirement.artifacts[?kind='design']
    op: exists                          # 设计文档已登记
  - path: requirement.status
    op: matches
    value: '^(design|decomposing)$'     # 状态停留在合法阶段（未越权推进）
  # 「trace 中含 kb 调用」由轨迹断言 ordered_contains 判；正文引用 kb 条目由人工抽样核
