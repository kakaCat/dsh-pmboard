# case D5 · 无 active run 的 run_status 解读（对抗幻觉） · serves: FR-2
case: D5
checks:
  - path: requirement.activeRun           # 无 active run，agent 不得编造运行状态
    op: absent
  - path: requirement.autoRun             # 不得为了「有进度可报」擅自起链
    op: eq
    value: false
  - path: queue.tasks                     # 台账不被污染（无新卡、无状态改动）
    op: count_lte
    value: 3
# 注：「不读成 null、不幻觉 running」的判据在轨迹断言 required_outcome 与 agent 回复话术（人工对照 notes）。
