outputs:
  tasks:
    - id: t-bb9da6
      title: 给迁移门补只读预检与可复制迁移命令
      implements: "改 src/repositories/migrationGate.ts：新增 MigrationFailure（code 用字面量类型 'REQBOARD_REQUIRES_MIGRATION'、message、hint、ledgerFile、dataRoot）与 PreflightResult 判别联合；新增纯读 preflightLedger(options): PreflightResult（只 existsSync 两次，不建目录不写文件）；把 hint 构造收成模块内唯一一处（node --import tsx/esm scripts/migrate-ledger-v10.ts --file <真实 ledgerFile> --out <真实 dataRoot> --apply，不做 shell 转义、不加引号）；assertLedgerMigrated 改为调用 preflightLedger 并 rethrow 同一 failure（message 文本逐字节不变，只多 hint 字段）。测试改 tests/reqboard/migration-gate.test.ts：补 preflightLedger 三态（有单册无 meta / 有单册有 meta / 两者皆无）、hint 含真实路径且不含 <单册> 与 <数据根>、以及「抛错 ⟺ ok:false 且 message 逐字相等」的同源断言。"
      serves:
        - FR-1
        - FR-3
      depends_on: []
      phase: implement
      side: backend
    - id: t-f6e737
      title: 抽出唯一信封模块并新增迁移门 503 映射
      implements: "新建 src/http/envelope.ts：把 src/http/routes.ts 里的 json / ok / fail 三个函数逐字节搬过去（不顺手改逻辑）；fail 增加两处改动——映射表新增 e.code === 'REQBOARD_REQUIRES_MIGRATION' ? 503（与既有 REQBOARD_BRIDGE_NOT_READY 分支并列），响应体在错误对象带 hint 时透出 hint: typeof (e as {hint?:unknown}).hint === 'string'。src/http/routes.ts 改为从 ./envelope.js import { json, ok, fail }，删除本地副本，createReqboardHandler 签名与全部 http/routers/* 调用点零改动。新建 tests/reqboard/degraded-startup.test.ts 并先落「信封与映射」段：用最小假 res（收集 statusCode 与 body）断言 503 与 hint。"
      serves:
        - FR-2
      depends_on:
        - t-bb9da6
      phase: implement
      side: backend
    - id: t-683371
      title: 新增未就绪 HTTP handler
      implements: "新建 src/http/not-ready.ts：导出 createNotReadyHandler(failure: MigrationFailure): (req, res) => Promise<void>；对任意 method 与任意子路径一律回 503 + NotReadyBody（success:false、error=failure.message、code=failure.code、hint=failure.hint），头为 Content-Type: application/json; charset=utf-8 与 Cache-Control: no-store；不带 Retry-After；不得写 text/event-stream，必须先写头再 end（SSE 路径不得挂起）。复用 src/http/envelope.ts 的 json，不自己拼信封。在 tests/reqboard/degraded-startup.test.ts 追加 handler 段（真 IncomingMessage 形状的假 req：{method, url} + 假 res）。"
      serves:
        - FR-2
        - FR-5
      depends_on:
        - t-f6e737
      phase: implement
      side: backend
    - id: t-ba11c3
      title: 接线降级启动分叉并双通道留痕
      implements: "新建 src/wiring/not-ready.ts：导出 enterNotReadyMode(ctx, failure, logger)，内部先 logger.error('reqboard 未就绪（HTTP 全端点 503）：' + detail) 与 captureDiag('reqboard-capture [NOT-READY]: ' + detail 单行化)，再走 (ctx as any).inject?.(['webServer'], ...) + webCtx.effect?.(...) 注册 { kind:'prefix', path:'/dashboard/api/reqboard', handler: createNotReadyHandler(failure) }（前缀字面量与 index.ts 正常分支逐字一致；本函数不触碰数据根）。改 src/index.ts：把 assertLedgerMigrated(...) 一行换成 const preflight = preflightLedger({...}); if (!preflight.ok) { enterNotReadyMode(ctx, preflight.failure, logger); return }，位置保持在 initCaptureDiag 与 'apply function STARTED' 留痕之后、new ShardedRequirementStore 之前；正常分支起自 new ShardedRequirementStore 且逐字节不变。在 tests/reqboard/degraded-startup.test.ts 追加启动分叉与留痕段（假 ctx 捕获 inject 调用与假 logger）。"
      serves:
        - FR-1
        - FR-5
        - FR-6
      depends_on:
        - t-683371
      phase: implement
      side: backend
    - id: t-e70cdf
      title: 客户端数据层透出服务端错误体
      implements: "改 src/client/api.ts：ApiError 构造签名增第三可选参数 hint（readonly hint?: string），message 与 code 语义不变；unwrap 的 !res.ok 分支改为先 await res.json().catch(() => undefined)，body.error 为非空字符串时用它作 message、否则回落 'HTTP ' + res.status（不制造假原因），并把 body.code 与 body.hint 原样传入 ApiError；fetchReqFile 里同样的 !res.ok 分支按同口径处理。改 tests/api-client.test.ts：沿用既有 mockFetchOnce 追加两条用例。"
      serves:
        - FR-4
      depends_on:
        - t-f6e737
      phase: implement
      side: frontend
    - id: t-cae674
      title: 看板报错区渲染可复制的迁移命令
      implements: '改 src/client/render/dom-utils.ts：buildError(message: string, hint?: string) 增第二可选参数；hint 非空时在既有 .dsh-pm-error 容器内追加「在终端执行：」标签与 <pre class="dsh-pm-error-hint">，message 与 hint 都继续走既有 esc() 转义（hint 含用户主目录路径）；hint 为空时输出与改动前逐字节相同。改 src/client/board-mount.ts：fetchAll 的 catch 分支改为 buildError(err instanceof ApiError ? err.message : String(err), err instanceof ApiError ? err.hint : undefined)。样式复用既有 .dsh-pm-error 令牌，不改 src/client/styles/。'
      serves:
        - FR-4
      depends_on:
        - t-e70cdf
      phase: ui
      side: frontend
