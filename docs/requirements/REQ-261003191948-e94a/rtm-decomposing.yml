      implements: 不改产品代码，只跑命令并把结果落成证据（docs/requirements/REQ-261003191948-e94a/evidence/）。核验四件事：① 三条回归命令全绿（migration-gate、degraded-startup、api-client）；② 兼容性——已迁移用户（单册在且 meta.json 在）与全新安装（两者皆无）下 preflightLedger 均 ok:true，且 HTTP 响应体不含 hint 字段（与改动前逐字节一致）；③ 旧调用方——assertLedgerMigrated 的既有断言不看 hint，重跑既有用例确认零回退；④ 纪律命令 pnpm typecheck 与 npx vitest run 的失败数与 C-14/C-15 基线逐项比对，写入 evidence 文件。
