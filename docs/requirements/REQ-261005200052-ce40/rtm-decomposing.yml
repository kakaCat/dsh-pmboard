  tasks:
    - id: t-97e904
      title: 加守卫两谓词与判定序：无门/无产物的票不拦写路径
      implements: "改 src/application/internal/pending-guard.ts：① 新增 hasConfirmGateOf(rec): boolean —— target==='plan' ⇒ true；target==='artifact' ⇒ kind ∈ Object.values(ARTIFACT_CONFIRM_GATES)（值域自 src/shared/protocol.ts 取，禁止另写 kind 名单）；② 新增 hasConfirmableArtifactOf(req, rec): boolean —— plan ⇒ req.plan !== undefined；artifact ⇒ (req.artifacts ?? []).some(a => a.kind === rec.kind)；③ livePendingConfirm 判定序扩展为：注册表过滤 → 台账查不到需求（保守留挂，返回该票）→ targetConfirmedInLedger 落章放行 → 谓词④ 无门放行 → 谓词⑤ 无产物放行 → 拦。零新 I/O（只读已在读的 req），放行不写任何状态。"
      serves:
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-028d50
      title: 原型登记不再产生挂起票 + 确认前移校验（不造空票）
      implements: ① src/application/use-cases/SubmitArtifact.ts：删掉原型登记第 ⑤ 步的 triggerAutoConfirm(kind='prototype') 整段（保留其上方的 notifyArtifactRegistered 通知），使登记原型不再在 ticket 表留记录；② src/application/use-cases/AskConfirm.ts：在 port.register(...) 之前追加两条校验 —— target==='artifact' && kindArts.length === 0 ⇒ 抛 REQBOARD_MISSING_ARTIFACT（文案与 applyConfirmDecision 内同源字符串一致）、target==='plan' && targetReq.plan === undefined ⇒ 抛 REQBOARD_MISSING_PLAN；既有「清理同窗口旧票」循环的位置与语义不变。
      serves:
        - FR-1
        - FR-5
      depends_on:
        - t-97e904
      phase: implement
      side: backend
    - id: t-1c8e8d
      title: 诊断投影与四处文案：拒绝原文/回执/通知/状态只列真实出路
      implements: ① src/application/internal/pending-guard.ts：新增 pendingConfirmFactsOf(req, rec, now)（requirementStatus / gate / artifactCount / expiresAt = (interruptedAt ?? createdAt) + LIMITS.pendingConfirmTtlMs / usableRecovery[]）与 pendingConfirmRejectMessage(p, facts?)（缺省 facts 时逐字保持旧文案，兼容既有调用点）；usableRecovery 只列真实出路：①取回执恒定；②「看板点确认」仅当 hasConfirmGateOf；③「重新发起覆盖」仅当目标需求是本窗口进行中需求且产物在册；产物数为 0 时附「先登记产物」，目标需求非本窗口/终态时附「agent 侧无法覆盖，请人点看板或等失效」。② src/application/use-cases/ConfirmReceipt.ts 的 receiptNote 接同一 facts。③ src/application/internal/artifact-gates.ts 的 artifactNotifyText 改为门感知（无门产物写「无需人工确认（登记即生效）」）。④ src/tools/StatusTool/StatusTool.ts 的 pending_confirms[] 追加 requirement_status / gate / artifact_count / expires_at / usable_recovery 五键（schema 与投影同改，旧键不动）。
      serves:
        - FR-3
        - FR-4
      depends_on:
        - t-97e904
      phase: implement
      side: backend
    - id: t-78a4c9
