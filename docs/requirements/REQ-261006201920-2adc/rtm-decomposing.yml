outputs:
  tasks:
    - id: t-4a918b
      title: 域层契约：占位符判据与声明式回填器
      implements: 改 src/domain/task/Acceptability.ts：新增 PLACEHOLDER_OPERAND 常量（命令位置=行首/空白/反引号/管道/&&/;/左括号之后且命令字后跟空白，其后 40 字符内出现尖括号 token 即命中），并在 checkAcceptance 里接入分支——顺序为 空话 → 占位符 → 无锚点，拒绝文案必须含占位符原文与「换成真实路径/编号」的修法。改 src/domain/task/SubtaskTemplate.ts：新增 ACCEPTANCE_PLACEHOLDERS 声明式闭集、unknownPlaceholders(text)、fillStageAcceptance(template, ctx)（ctx={requirementId,taskId,parentAcceptance}；从父卡验收标准提取测试路径与脚本路径，测试文件取不到落 tests/、脚本取不到落 *.mts，回填产物自检不得再有尖括号 token，有则抛）。新增 tests/acceptance-placeholder.test.ts（TC-1 命中即拒 + TC-2 四类合法反例放行）；扩 tests/domain/subtask-template.test.ts（TC-5 词表闭集不变量）。验证：npx vitest run tests/acceptance-placeholder.test.ts tests/domain/subtask-template.test.ts；反向演练 RV-1：注释掉占位符分支该文件必红，还原后绿，两次输出留档。
      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
    - id: t-cdd289
      title: 子卡落库回填接线（懒展开）
      implements: "改 src/application/internal/lazy-expand.ts 的 makeChild：先生成子卡 id（ids.task()），再以 {requirementId: parent.requirementId, taskId: 子卡 id, parentAcceptance: parent.acceptance} 调 fillStageAcceptance；回填结果同时用于 acceptance 与 implementation 里嵌入的那段验收描述（两处必须同源，不许一处回填一处原样）；回填抛错即中止落库，不留半成品。expandSubtasks 与 regenerateChain 共用 makeChild，故补链路径自动同口径。新增 tests/lazy-expand-backfill.test.ts（TC-3 / TC-4 / TC-6）；回归 tests/lazy-expand.test.ts 与 tests/regenerate-chain.test.ts。验证：npx vitest run tests/lazy-expand-backfill.test.ts tests/lazy-expand.test.ts tests/regenerate-chain.test.ts；反向演练 RV-2：注释掉回填调用 ⇒ 「残留为 0」断言变红，还原后绿，两次输出留档。"
      serves:
        - FR-1
      depends_on:
        - t-4a918b
      phase: implement
      side: backend
    - id: t-a7b288
      title: 领域裁决判据：返工过检 + 结果锚点 + 人工项事实 + 处置模板
      implements: 改 src/domain/workflow/AcceptanceSheetSpec.ts，四件事：① reworkSpecFor 三级取值——item.criterion 过 checkAcceptance+checkHowToVerify 则直接用，否则取来源卡 acceptance，仍不过则合成「修复对象 + 可跑命令 + 期望读数」三段式标准，每级都必须过两道判据；ReworkTaskSpec 增 requirementRefs/prototypeRefs/decisionRefs/footprint/acceptanceSource 并从来源卡逐字继承（prototypeRefs 也必须继承，否则 UI 卡返工卡会被 UI 卡原型锚点门禁钉死）。② 新增 RESULT_ANCHOR（命令/代码文档路径/明确计数/证据介质 .png .jpg .webp .log 等，文件头写明与 domain/workflow/EvidenceAnchor.ts 的分工与差集）与 HUMAN_FACT（现象词/截图/证据路径）；applyVerdicts 前置校验增：needsHuman 项文本去空白长度 ≤6 或无可辨识事实即拒。③ 新增 DISPOSITION_TEMPLATE（已处置：补了/已补/补上/新增/加了/修了/已覆盖；确认无需：确认无需/无需/不需要/不适用/暂不/不做；两义均要求去空白长度 >6），系统项通过未命中即拒（替换既有「非空即可」口径）。④ dispositionMissingItems 语义收紧为「未写或未命中模板」，并接入 isFullyDecided 与 sheetGateStatus，使处置为空真的不放行归档。新增 tests/rework-gate.test.ts、tests/verdict-result-anchor.test.ts、tests/system-item-disposition.test.ts。验证：npx vitest run 五个用例文件；反向演练 RV-3 与 RV-5 各两次输出留档。
      serves:
        - FR-2
        - FR-3
        - FR-4
      depends_on:
        - t-4a918b
      phase: implement
      side: backend
    - id: t-cf28bb
      title: 覆盖原子写入与两通道透传
      implements: 改 src/application/internal/verdicts.ts：VerdictInput 增可选 changeReason；在既有「人改结果」写入块里判定覆盖（该次裁决带文本 且 与该项现有 result 不同 且 resultSource==='agent'），覆盖生效时一次性写全 result / resultSource='human' / resultSuperseded（首次覆盖写入，重复覆盖不覆盖该字段）/ resultChangeReason；缺理由时抛 VerdictError code='result_change_reason_required'，文案给「可不覆盖 / 或补理由」两条路，且台账零改动（保持 agent 原文与 agent 来源）；回滚开关 DSH_REQBOARD_NO_ITEM_RESULT 生效时整段跳过；materializeReworkTask 把规格里的 requirementRefs/prototypeRefs/decisionRefs/footprint/acceptanceSource 搬到 TaskRecord。改 src/http/routers/verdicts.ts：从 body.verdicts[] 解析 changeReason（normalizeText 上限 1000）并透传，不构成覆盖时缺字段不报错。改 src/application/use-cases/AcceptSheet.ts：第一轮问答后对会被判为覆盖的项补一轮问答（问题 id 形如 <itemId>#change-reason），未作答即不执行覆盖并按未覆盖记录裁决，不拒绝整批。新增 tests/result-override-reason.test.ts（TC-13/TC-14/TC-15）。验证：npx vitest run tests/result-override-reason.test.ts tests/verdicts-http.test.ts tests/verdicts-and-rework.test.ts tests/accept-sheet-tool.test.ts；反向演练 RV-4：把覆盖理由校验改成恒真 ⇒ 「缺理由即拒」变红，还原后绿。
      serves:
        - FR-3
      depends_on:
        - t-a7b288
      phase: implement
      side: backend
    - id: t-ebc36c
      title: 裁决行新控件：理由输入、原文保留、归档门可见（UI）
      implements: 改 src/client/views/panels/verify.ts 与 src/client/stage-panel.ts：新增共用的同一段渲染（禁止复制粘贴），为 resultSource==='agent' 且非 needsHuman 的项渲染 .dsh-pm-vitem-change-reason 理由输入（编辑预填值时才要求必填），被覆盖项渲染 data-superseded="1" 的「原实测结果（已被覆盖）」留存展示；needsHuman 项与 gapKind 项的就地拒收提示复用同一文案源。改 src/client/board-mount.ts：在 case 'submit-verdicts' 里收集 changeReason（判据=输入框当前值 ≠ defaultValue）并在缺理由时就地拦下点名该项；保留既有 missingFailed/missingHuman 两条守卫不动。改 src/client/styles/board.ts：新控件样式复用既有令牌（不新增色板），未复核 与 已通过 的区分不得只靠颜色（徽标文字必须不同）。新增 tests/client-verify-disposition.test.ts。验证：npx vitest run tests/client-verify-disposition.test.ts tests/client-view.test.ts tests/stage-detail.test.ts；pnpm build:client 必须含 [verify-client] OK。
      serves:
        - FR-3
