      implements: 在 src/shared/protocol.ts 的 VerificationItem 与 src/domain/workflow/AcceptanceSheetSpec.ts 的 SheetItemLike 成对新增可选字段 unverifiedReason（'blank_pass' | 'anchor_missing'）；抽出纯函数 judgePassedVerdict({item, opinion}) 返回 {status, reason?}，按 design/backend.md S-1 的六条顺序实现（人工项不吃锚点判据）；在 tests/verdict-downgrade-reason.test.ts 钉死四类输入。不改 hasResultAnchor 词表。
      serves:
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-b44770
      title: 裁决侧写降级原因并在人工自填无锚点时拒绝
      implements: 在 src/domain/workflow/AcceptanceSheetSpec.ts 的 applyVerdicts 接上 judgePassedVerdict：降级时写 unverifiedReason、status 变 passed/failed 时清空；新增纯函数 isHumanAuthored(item, opinion)（文本非空且与 item.result 不同）；命中无锚点且人工自填时抛 REQBOARD_VERDICT_ANCHOR_MISSING（写盘之前抛，保证台账零改动）。在 tests/verdict-human-anchor-reject.test.ts 覆盖拒绝路径与零输入通过不误伤。
      serves:
        - FR-2
        - FR-3
      depends_on:
        - t-3951af
      phase: implement
      side: backend
    - id: t-80b0dc
      title: 提交侧锚点体检入桶
      implements: 在 src/domain/workflow/ResultBinding.ts 的 ResultMatchReport 增 unanchored 桶，matchStructuredResults 按 design/backend.md S-3 入桶：命中项 → needsHuman 非真 → 非系统项（gapKind 空）→ 文本非空 → !hasResultAnchor。判据只调用既有的 hasResultAnchor，禁止另写正则。tests/result-anchor-submit.test.ts 先写桶级断言（普通项入桶、人工项与系统项不入桶）。
      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
