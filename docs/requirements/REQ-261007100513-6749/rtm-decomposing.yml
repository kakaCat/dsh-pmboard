    - id: t-74eb0c
      title: 定死接口与数据契约（端口 / 可选字段 / 逐项结果类型）
      implements: "按 interfaces.md 的 I-1~I-5 与 data-model.md 落类型：① src/application/ports.ts 加 VolatileNoticePort（notify 永不抛）与运行态存储端口方法；② src/shared/protocol.ts 加 TaskRecord.budgetRequests?: number、VolatileNoticeKind、TaskMoveItemResult、TaskTreeSummary、SubtasksBudgetState；③ 客户端镜像 src/client/types.ts 同步；④ 四处手工投影补字段透传：src/application/query/QueryStageDetail.ts、src/application/internal/sheet-tasks.ts、src/application/query/QueryDag.ts、src/http/routers/stages.ts；⑤ 新增 tests/contract-types.test.ts 断言端口与字段存在、且 budgetRequests 不进 REQUIRED_TASK_FIELDS。不动状态机、不 bump REQBOARD_SCHEMA_VERSION / QUEUE_VERSION。验证：pnpm typecheck 零错 + pnpm build:client 退出码 0。"
      serves:
        - FR-1
        - FR-2
        - FR-3
        - FR-4
        - FR-5
        - FR-6
      depends_on: []
      phase: implement
      side: backend
    - id: t-cb4684
      title: 头部段稳定化：易变内容移出 system prompt
      implements: ① 新增 src/application/internal/volatile-notice.ts（纯函数 buildVolatileNotice / noticeHash / pickDebounced，无 I/O）；② 改 src/application/internal/capture-section.ts：boundSectionTextFrom 只产「绑定关系 + 常量块」（需求 id/标题 + 流水线纪律），状态行 / 当前任务 / 阶段纪律正文移出头部，改由 volatile-notice 组装；③ 改 src/gate-wiring.ts 的 section.text 只返回头部并保持 interpolate:false；④ 新增 tests/capture-section-stability.test.ts 钉死逐字节稳定。既有 capture.test.ts / stage-prompts.test.ts 的断言语义逐字不变。
      serves:
        - FR-1
      depends_on:
        - t-74eb0c
      phase: implement
      side: backend
    - id: t-ef4b17
      title: 尾部增量投递：内容哈希去重、去抖与降级兜底
      implements: ① 新增 src/application/internal/notice-delivery.ts（编排：hash 比对 → 去抖 → 投递 → 更新哈希表 → 留痕；实现 VolatileNoticePort，永不抛）；② 新增 src/adapters/VolatileNoticeAdapter.ts：agents.get(windowKey) → inboxOf(agent).prepend('next-step', msg)，msg 自署 source（kind:'dive'，禁止冒充 user）；失败分支退回头部并留痕；③ 改 src/application/internal/injection-log.ts 加 origin 取值 'system-notice'（只增，读端容忍未知）；④ src/domain/limits.ts 加 noticeDebounceMs=1000；⑤ src/index.ts 装配端口；⑥ 新增 tests/volatile-notice.test.ts。禁用 agent.followup（会新起回合）。
      serves:
        - FR-2
        - FR-3
      depends_on:
        - t-cb4684
      phase: implement
      side: backend
    - id: t-95086b
      title: 记账批量推进：逐项结果、回执树摘要、节流结构化
      implements: ① 改 src/application/use-cases/MoveTask.ts：拆 planMoveTasks（只读校验产计划：席位/绑定/合法边/依赖门/父卡上限/done 凭证门逐卡/节流）与 applyMovePlans（一次 mutateQueue 落全部合法项，随后需求 rollup 与 RTM 同步）；单卡路径成为批量特例，旧 11 键返回逐字保留。② 改 src/tools/TaskMoveTool/TaskMoveTool.ts：加 tasks[]（1–20）与 budget 子对象；回执加 results[] / partial / tree / tree_note / throttleRemainingMs / guidance。③ 改 src/application/use-cases/TaskTree.ts 抽出可复用的树摘要 helper（复用 TaskTreeNodeView，只取一层）。④ 改 src/domain/workflow/DoneEvidenceSpec.ts 的节流判定入参：同批提交的卡互不触发（跨批仍触发），判据本身不改。⑤ 新增 tests/task-move-batch.test.ts 与 tests/done-throttle-guidance.test.ts。
      serves:
        - FR-4
        - FR-5
      depends_on:
        - t-74eb0c
      phase: implement
      side: backend
    - id: t-111f24
      title: 子卡预算软门禁：计数、到顶先停后报、幂等放行
      implements: ① 新增 src/application/internal/subtask-budget.ts（纯判定 openBudgetWindow / chargeRequest / releaseBudget，窗口开时定格 limit，放行幂等）；② 新增 src/application/internal/request-counter.ts（只读订阅 session/event 的 assistant/message，按子会话归属；**不套 isIgnoredSession**；计数落 state/subtask-budget.json，缺失即「计数不可得」）；③ 新增 src/application/internal/task-comment.ts（appendTaskComment 内部 helper，写 TaskRecord.comments，**非工具**）；④ 改 src/application/use-cases/ExecuteTask.ts：executeSubtask 开窗（workflow 与 team 两条路线共同入口）；⑤ 到顶处置复用 src/application/internal/awaiting-confirm.ts 的 enterAwaitingConfirm/exitAwaitingConfirm（先停 → 卡评论 + owner 通知 → 等放行）；owner 通知走 inbox（活跃 next-step / 空闲 next-turn），**禁用 deliver/followup**；⑥ src/domain/limits.ts 加 subtaskRequestBudget=60；⑦ 新增 tests/subtask-budget.test.ts。
