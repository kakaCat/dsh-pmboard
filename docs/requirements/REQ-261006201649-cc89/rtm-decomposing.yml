      serves:
        - FR-1
      depends_on: []
      phase: implement
      side: backend
    - id: t-213142
      title: 把非骨架判据接进锚点门并在它之后接几何量证据校验
      implements: 在 src/application/ports.ts 新增 PrototypeEvidencePort（exists / sha256Of，窄面），生产实现挂到 src/adapters/FileDocRepository.ts（exists 已有，新增 sha256Of）；在 prototype-gates.ts 新增 observationEvidenceOf(o, deps) 与 humanReasonHasFact(reason)，并给 ProtoObservation 加 shot / shotSha256 两个加性可选键（observationsOf 解析它们，不影响既有六字段）。改 checkPrototypeAnchorsGate：权威原型存在后先判 prototypePlaceholderOf（命中 → code prototype_placeholder，gaps 点名路径与命中判据），未命中或基线不可得再走既有锚点/geometry 块/阈值判定，最后逐条 observationEvidenceOf，invalid → code prototype_geometry_unverified 并点名观测量名与理由；早退纪律不变（INDEX 缺失/缺列/authoritative ≠ 1 时全部返回 undefined）。存量豁免：createdAt < DOC_QUALITY_RULES_SINCE 时新判据整段不判（复用 docQualityRulesApply，不另立日期）。新建 tests/prototype-placeholder-gate.test.ts 与 tests/prototype-geometry-evidence.test.ts。
      serves:
        - FR-1
        - FR-2
        - FR-4
      depends_on:
        - t-d10419
      phase: implement
      side: backend
    - id: t-da2ad7
      title: 对照项由可选改硬判据并改读 INDEX 权威行
      implements: 改 src/application/use-cases/SubmitVerification.ts 的 compareInputsOf / prototypeHtmlPathOf：只要 prototypes/INDEX.md 有唯一 authoritative 行（复用 parsePrototypeIndex，不自己再解析一遍表格）就组装 prototype-compare 项，不再以「台账里有已登记 .html 产物」为条件；INDEX 读不出但台账有产物时降级为既有「排序首项」并在验收材料注明降级（不新增码）；存量需求（createdAt < DOC_QUALITY_RULES_SINCE）原样早退；prototype_exempt 生效需求仍走豁免说明行且不阻塞；非 UI 需求不组装（出现条件不变）；CompareInputs 形状与 ResultBinding 的 ref 键一字不动。新建 tests/verification-prototype-compare-required.test.ts。
