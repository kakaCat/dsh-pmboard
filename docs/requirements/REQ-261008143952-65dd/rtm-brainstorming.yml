    - id: D-2
      source: 2026-10-08 需求分析："overrides.md 的引用完整性核对，是逐条人工 grep，还是写自动化脚本？"
      verdict: 人工 grep：7 份 × 平均 6 条 = 约 42 条引用，写脚本成本高于人工逐条核对。design 阶段写测试策略时评估是否值得自动化；若后续需频繁更新 vendor，再投自动化。本次是首次全量同步，引用点数量可控；若发现引用失效较多或 vendor 更新频率高，design 阶段再列「引用完整性自动化测试」任务。
      serves:
        - FR-2
      criterion: 7 份 overrides.md 的每条「覆盖 N」都能在对应 vendor 原文里 grep 到被覆盖的关键词
    - id: D-3
      source: 2026-10-08 需求分析："新版 executing-plans（373 行）与旧版（64 行）差异巨大，是否要重写 implementing/heavy.md 与 implementing/heavy/overrides.md？"
      verdict: 不重写：implementing/heavy.md 是本仓自写档（含 reqboard_task_move / reqboard_task_report 等本仓工具面接线），新版 executing-plans 的 inline 执行纪律可选择性吸收（如 ledger / ruling），但不全盘替换。overrides.md 核对引用完整性即可，不因 vendor 大改而重构。本仓流水线（六节点）与 superpowers 流水线（brainstorming + writing-plans + executing-plans）本就不一致；vendor 更新是为了吸收其最佳实践（如 ledger 记录、ruling 决策留痕），不是为了复刻其流程。
      serves:
        - FR-1
        - FR-2
      criterion: implementing/heavy.md 与 implementing/heavy/overrides.md 保持本仓自写档结构，只更新 vendor/superpowers/executing-plans/SKILL.md
