      source: 2026-10-08 勘察阶段："brainstorming 的 vendor 原文已是本仓自写完整档，为什么还要更新 vendor 目录里的 SKILL.md？"
      verdict: 更新：vendor 目录存的是"原始 superpowers 官方版本"，用于留档与对比；本仓注入的 heavy.md 是自写档，两者并存。overrides.md 的"上文"指的是 heavy.md（本仓自写档），不是 vendor/brainstorming/SKILL.md。本仓 brainstorming/heavy.md 开头注释写明「vendor 原文留档 `src/domain/prompt/vendor/superpowers/brainstorming/SKILL.md`（不再作为 heavy 主 skill 注入）」——vendor 目录是历史存档，不参与实际注入，但要保持与上游同步供对比。
