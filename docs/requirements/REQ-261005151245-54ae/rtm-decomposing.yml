outputs:
  tasks:
    - id: t-2e4376
      title: 契约与继承模块（端口三方法 + 标题递增 + 落定编排）
      implements: "`src/application/ports.ts` 加 5 个类型（WindowInheritanceStatus / WindowSourceProfile / WindowProfileRead / WindowModelSelection / WindowInheritance）与 WindowCreateOptions.agentPreset、WindowOpenerPort 三个可选方法（readProfile / rename / selectModel）。新增 `src/application/internal/window-inherit.ts`：increasedWindowTitle（半角与全角括号递增、无后缀追加 (1)）、readWindowProfile（端口缺失或抛错收成 reason，永不抛）、presetInheritanceOf（有预设 / 无预设 / 画像读不到三态）、applyWindowInheritance（标题→模式→模型三步不短路，reasons 文案按 interfaces §reasons 规则；零 I/O、文件 ≤400 行）。建立 `tests/open-window-inherit.test.ts`（文件头 20 行内含 serves 头注）覆盖标题三形态与空标题边界、预设三态、画像读不到时三项 failed、rename 与 selectModel 抛错不短路。"
      serves:
        - FR-1
        - FR-2
        - FR-3
        - FR-4
        - FR-5
      depends_on: []
      phase: implement
      side: backend
    - id: t-a0e60b
      title: 适配器实现（读画像 / 写标题 / 写模型 / create 透传模式）
      implements: "`src/adapters/SessionWindowOpener.ts` 新增三个方法：readProfile(sessionId) 调 sessionController.projections 一次读全 title / agentPreset / modelSelection.next（空串与缺键按缺失；三项都缺返回空对象；服务不可用或宿主抛错即抛错）、rename(sessionId, title)、selectModel(sessionId, selection)（reasoningEffort 缺省时不带该键）；createRequestOf 透传 opts.agentPreset（与 workspaceId / cwd 的互斥规则逐字不变）；构造函数与「服务按调用时解析」风格不变。用例补在 `tests/open-window-inherit.test.ts`（假宿主服务断言调用入参与抛出原文）。"
      serves:
        - FR-2
        - FR-3
        - FR-4
      depends_on:
        - t-2e4376
      phase: implement
      side: backend
    - id: t-2789e5
      title: 用例接线（openWindow 与 handoffOwner 新建窗口）
      implements: "`src/application/use-cases/OpenWindow.ts`：入参加 title；顺序改为读画像 → create 带 agentPreset（无则不传该键）→ 建窗成功 → applyWindowInheritance → 投递；OpenWindowValue 加 inheritance；既有三条拒绝分支逐字不变。`src/application/use-cases/HandoffOwner.ts`：openTargetWindow 返回 { windowKey, inheritance? }，新建窗口带回执、to_window 指定已有窗口时不带。用例：`tests/open-window-inherit.test.ts` 落 T-01~T-14；`tests/handoff-owner.test.ts` 补两条断言。"
      serves:
        - FR-1
        - FR-5
        - FR-6
      depends_on:
        - t-a0e60b
      phase: implement
      side: backend
    - id: t-a65a55
      title: 外壳接线（工具 schema / 一行摘要 / 迁移开窗路由）
      implements: "`src/tools/OpenWindowTool/OpenWindowTool.ts`：parameters 加 title（≤200 字符）、output schema 加 inheritance、一行摘要追加三态读数；`src/tools/OpenWindowTool/prompt.ts` 补继承与三态说明；`src/tools/HandoffTool/HandoffTool.ts` output schema 加 inheritance；`src/http/routers/settings-support.ts` 的 openMigrationWindow：create 前读画像并把 preset 带上、create 后用显式标题「台账迁移窗口」落定、返回值加 inheritance。用例补 `tests/open-window-inherit.test.ts`（T-15 迁移函数级）。"
      serves:
        - FR-1
        - FR-5
        - FR-6
      depends_on:
        - t-2789e5
      phase: implement
      side: backend
    - id: t-6e1a6c
      title: 探针与机器自检（回归 + 构建 + 知识层生成物 + 尺寸门禁）
      implements: 新增 `scripts/open-window-inherit-probe.mts`（假宿主服务跑通三入口链，打印 source_title / child_title / source_preset / child_preset / source_model / child_model 六读数并断言三对相等，另打印三段附加耗时；退出码 0 或 1）；跑并记录 `pnpm build`、`pnpm typecheck`、`pnpm test`（对照基线 106）、`npx tsx scripts/kb-build.mts --write` 后 `pnpm kb:check`、`npx vitest run tests/size-budget.test.ts`；命令与输出摘要写进 `docs/requirements/REQ-261005151245-54ae/evidence/checks.md`。
