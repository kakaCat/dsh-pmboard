    - id: t-7fea40
      title: 兼容卡与实机复核（旧调用方 / 旧替身 / 界面三处取证）
      implements: 在 `tests/open-window-inherit.test.ts` 加「兼容」分组：旧测试替身（只有 fork 与 create）三项 failed 且开窗成功、既有回执键（success / window_key / parent_session_id / mode / degraded_note / delivery）逐字不变、degraded_note 含「请在侧栏打开」且不含「已打开」；实机复核：在 GUI 源窗口（创造模式 + 非默认模型 + 标题「登录重构」）调 reqboard_open_window，看侧栏标题、打开新窗口看模式芯片与模型选择器，三处观察连同回执三态写进 `docs/requirements/REQ-261005151245-54ae/evidence/live-check.md`。
