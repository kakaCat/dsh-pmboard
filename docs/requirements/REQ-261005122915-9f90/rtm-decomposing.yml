outputs:
  tasks:
    - id: t-7af9da
      title: 定义占位卡判据单点（isReworkPlaceholder / liveRealCards）
      implements: 新增 src/domain/task/ReworkPlaceholder.ts：导出 isReworkPlaceholder(t)（判据 reworkOf 非空）与 liveRealCards(tasks)（status !== 'canceled' 且非占位），零外部依赖（层边界只许向内）。新增 tests/rework-placeholder.test.ts：断言占位卡与 canceled 卡不进 liveRealCards、普通真卡进。
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-a01528
      title: 抽「回退态收敛占位卡」为单一实现并让手动拆分改调
      implements: 新增 src/application/internal/stale-rework.ts 导出 cancelStaleReworkCards（占位卡置 canceled + 追加 kind=rollback 修订；无候选不写盘）；把 src/application/use-cases/Decompose.ts 的内联 mutateQueue 收敛块（现 219~241 行）替换为调用该模块。新增 tests/decompose-stale-rework.test.ts。
      serves:
        - FR-2
      depends_on:
        - t-7af9da
      phase: implement
      side: backend
    - id: t-f92ad7
      title: 落库幂等只看真卡 + 回退态前置收敛（landApprovedPlan）
      implements: 改 src/application/internal/approved-plan-landing.ts：① 计算 rollbackTo（口径照抄 Decompose.ts）；② rollbackTo 有定义时先 await cancelStaleReworkCards；③ 幂等判定改为 checkDecomposeIdempotency(fresh.status, liveRealCards(tasks), { rollbackTo })；④ 返回体加 staleReworkCanceled，alreadyLanded 语义收窄为真卡数。新增 tests/approved-plan-landing-rework.test.ts。
      serves:
        - FR-1
        - FR-2
      depends_on:
        - t-a01528
      phase: implement
      side: backend
    - id: t-a31e2a
      title: 两条批准路径推进判据收窄：落库没真发生就不推进
      implements: 改 src/application/internal/confirm-settle.ts：落库证据由「未取消卡数」换「真卡数」（liveRealCards 取数），alreadyLanded>0 分支保留但凭真卡成立；改 src/http/routers/requirements.ts 的 handlePlanDecision：仅 createdCount>0 || alreadyLanded>0 才 transitionRequirement('implementing')，否则写失败评论 + landing.failed 且不推进。新增 tests/confirm-settle-landing-gate.test.ts。
      serves:
        - FR-3
      depends_on:
        - t-f92ad7
      phase: implement
      side: backend
    - id: t-9a8894
      title: 再次回退时占位卡取消而非复位（planRollbackTasks 分流）
      implements: 改 src/application/internal/rollback-tasks.ts：resetTasks 的过滤加 !isReworkPlaceholder(c)，占位卡留在 canceled 数组（调用方写入路径不变）。在 tests/rollback-materialize.test.ts 增补第二轮回退断言。
      serves:
        - FR-4
      depends_on:
        - t-7af9da
      phase: implement
      side: backend
    - id: t-661b0f
      title: 看板需求详情接上「清理误物化重做卡」入口与回执
      implements: src/client/api.ts 加 rollbackCleanup（复用 post 助手，POST /req/rollback-cleanup）；src/client/views/stage-detail.ts 的 renderActionBar 追加按钮（仅 req.rollback 存在时渲染，data-seq = rollback.seq ?? 1）；src/client/board-mount.ts 加 case 'rollback-cleanup'（confirm 说明后果 → 调 api → alert 逐行展示 note/canceled/restoredLinks/逐条 skipped → fetchAll）。新增 tests/client-rollback-cleanup.test.ts。
      serves:
        - FR-5
      depends_on: []
      phase: ui
      side: frontend
    - id: t-a1a67b
      title: 逆验证（三条必红）与 3b02 现场复演证据
      implements: 新增 tests/rework-inverse-verification.test.ts（三条逆验证：把判据换回旧实现必须变红）与 scripts/rollback-landing-replay.mts（对 REQ-261005105032-3b02 现场复演：清场第 1 次回退 → 重新落库 → 打印活卡集合）。红/绿输出留档到需求 notes/。
      serves:
        - FR-1
        - FR-2
        - FR-3
        - FR-4
        - FR-5
      depends_on:
        - t-a31e2a
        - t-9a8894
        - t-661b0f
      phase: test
      side: fullstack
    - id: t-fa6136
      title: 兼容与存量核对：语义收窄的消费者盘点、无迁移确认
      implements: 写 docs/requirements/REQ-261005122915-9f90/notes/compat-check.md：盘点 alreadyLanded 的全部消费者（两条批准路径）并确认语义收窄无外部契约；确认无 schema 改动与数据迁移。
      serves:
        - FR-1
      depends_on:
        - t-f92ad7
      phase: test
      side: backend
