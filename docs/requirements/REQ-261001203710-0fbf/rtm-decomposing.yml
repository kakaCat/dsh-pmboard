      implements: kb 检索读取处：按当前项目根解析；文件不存在时区分两种病因——① 本项目确实未生成 → 报「本项目知识层未生成」+ 解析出的项目根 + `npx tsx scripts/kb-build.mts --write`；② 空间错配 → 报「项目根与索引位置不一致」+ 两个路径。沿用统一信封，不新增枚举。测试：两病因各一例（含改名反向例）。
      serves:
        - FR-2
      depends_on:
        - t-0c73fc
