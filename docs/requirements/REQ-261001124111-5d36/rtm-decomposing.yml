    - id: t-e5225f
      title: 刷新调度器：纯逻辑 + 假计时器单测
      implements: 新建 src/client/panel-refresh.ts，按 design/interfaces.md 落 RefreshReason / PanelFreshness / PanelRefreshOptions / PanelRefresh / createPanelRefresh。语义：start() 立即 refresh('open') 并起周期；intervalMs=0 只拉一次；在飞时 refresh() 立即返回且不发新请求；失败不调 onData、failureCount++、lastError 截断 120 字符；成功清错并更新 fetchedAt；stale = fetchedAt 缺失 || now()-fetchedAt > staleAfterMs（跃迁时 onChange）；stop() 用代际计数作废在飞响应。计时器/时钟全部可注入（默认 setInterval/clearInterval/Date.now）。零 React/DOM/服务端 import。
      serves: []
      depends_on: []
      phase: implement
      side: frontend
    - id: t-fd98e6
      title: 面板新鲜度渲染：数据时间 / 失败红条 / 版本提示
      implements: 改 src/client/node-panel.ts：NodePanelInput 加可选 freshness / buildNotice；renderHead 内加 <span class="dsh-pm-np-fresh" data-fetched-at data-stale data-refresh-ms>（文案「数据时间 HH:MM:SS」，无数据「—」，stale 时加 is-stale）；新增 renderFreshnessBar() 渲染 dsh-pm-np-fresh-err（role=alert，「刷新失败：<原因> · 显示的是 HH:MM:SS 的旧数据」）与 dsh-pm-np-build-notice（role=status + data-action=np-reload，「插件已更新（S1 → S2），点此刷新」）。渲染顺序：head → 版本提示 → 失败红条 → 既有内容。src/client/styles/node-panel.ts 加 4 个类（复用既有变量与警示色，不新增色值）。
