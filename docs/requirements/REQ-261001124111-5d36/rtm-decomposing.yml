      implements: "改 src/client/conversation-progress.ts：展开时 createPanelRefresh({fetchOverview: () => fetchStageOverview(reqId), intervalMs, staleAfterMs, onData, onChange}).start()，关闭时 stop()；reqIdForStage 变化时先 setStageOverview(null)（loading）再按新 id 重开；原「按 req.updatedAt 重拉」Effect 与 SSE Effect 改为只调 refresh('event')；新增 document 级委托 data-action=\"np-reload\" → location.reload()；把 freshness/buildNotice 传给 renderNodePanel。改 src/plugin-config.ts 加 panel?: { refreshMs?: number; staleAfterMs?: number } 解析函数（默认 5000 / 30000，refreshMs=0 = 关闭轮询）。"
      serves: []
      depends_on:
        - t-fd98e6
      phase: implement
      side: frontend
