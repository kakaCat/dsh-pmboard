outputs:
  tasks:
    - id: t-14f9c2
      title: 给 PendingConfirmRegistry 加只读 findOpen
      implements: 在 src/adapters/PendingConfirmRegistry.ts 新增只读方法 findOpen(input)：按 (requirementId, target, kind) 查「未作答（outcome === undefined）且未过期」的记录，命中至多返回一条，未命中返回 undefined。判定必须是纯读：体内不得调用 settle / register / markInterrupted，不改任何字段、不续期。kind 缺省时按 target='plan' 的口径匹配。同时新增 tests/pending-confirm-registry-findopen.test.ts，用构造好的注册表实例断言五种情形：同门命中、跨 windowKey 命中、已作答不命中、已过期不命中、target='plan' 且 kind 缺省命中。register / get / pendingForWindow / settle / markInterrupted / TTL / storageActions 系列逐字不动。
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-073a6a
      title: 新增 gate-request.ts 建门唯一入口（复用→早退→新建）
      implements: 新建 src/application/internal/gate-request.ts，导出 GateRequestInput / GateRequestOutcome / requestGate(deps, input, exec)。判定顺序固定为 reused（经 registry.findOpen 命中同门未作答门 ⇒ 返回原 ticket，不弹框不登记不写台账不续期）→ already-settled（同 target+kind 已落章 ⇒ 复用 AskConfirm 既有早退读取口径，返回既有确认态）→ opened（登记门并交给调用通道弹框）。前置校验沿用 AskConfirm 既有错误码（NO_BOUND_REQ / NOT_BOUND_TO_WINDOW / INVALID_INPUT / MISSING_ARTIFACT / MISSING_PLAN），判定阶段零副作用、不抛业务错。同时新增 tests/gate-request-uniqueness.test.ts 的 U1~U5 前身用例（假 deps 直接单测 requestGate 三分支：复用 / 早退 / 新建；含弹框端口计数与票表计数断言）。
      serves:
        - FR-1
        - FR-3
      depends_on:
        - t-14f9c2
      phase: implement
      side: backend
    - id: t-989d03
      title: auto-confirm 改走 requestGate（自动弹不再重复建门）
      implements: 改 src/application/internal/auto-confirm.ts::triggerAutoConfirm：先调 requestGate，仅 mode==='opened' 时投递弹框；reused / already-settled 时返回 {triggered:false, reason:'该门已有一个在等的框（ticket=…）'}，不再 fire-and-forget 投递。既有的原型存在门窄口径预判保持在其前、逐字不变（无门产物仍不建门）。弹框通道不可用的探测分支与失败告警端口不变。
      serves:
        - FR-1
        - FR-3
      depends_on:
        - t-073a6a
      phase: implement
      side: backend
    - id: t-aa311c
      title: AskConfirm 改走 requestGate 且陈旧票清理分门
      implements: 改 src/application/use-cases/AskConfirm.ts：① 请求路径改走 requestGate——reused 时返回 {success:true, confirmed:false, advanced:false, pending:true, ticket:<原票>, note:'该确认已有一道门在等…'}（不新增返回键）；already-settled 时沿用既有早退返回体与措辞（含「未重复弹框（FR-9/FR-11）」）；opened 时保持既有登记 + 弹框 + 赛跑逻辑不变。② AskConfirm.ts:242 的「登记新票前把同窗口旧票一律 settle」改为分门：同门（同 requirementId+target+kind）跳过（保留给 requestGate 复用），异门仍 settle（防窗口被钉死）。③ evidence 文字路径保持直接落章，但落章改由 confirm-settle 的前提检查把关（t6 提供）。
      serves:
        - FR-1
        - FR-2
      depends_on:
        - t-073a6a
      phase: implement
      side: backend
    - id: t-d35599
      title: 验收门自动确认改走 requestGate（阻塞形态不变）
      implements: 改 src/application/use-cases/SubmitVerification.ts 的自动验收确认块：由直接 await askConfirm 改为先经 requestGate，opened 时才弹框；reused / already-settled 时不弹框，回执 note 相应改写（写明已有一道门在等 / 已确认）。保持 await 阻塞形态与 blockers 条件逐字不变（本次不统一 G4 的阻塞形态，见设计 B-7）。
      serves:
        - FR-1
        - FR-3
      depends_on:
        - t-073a6a
      phase: implement
      side: backend
    - id: t-ac6dbe
      title: confirm-settle 落章两前提 + 首写不变 + recordStaleAnswer
      implements: 改 src/application/internal/confirm-settle.ts：① 新增 SettlePrecondition 计算——gateOpen（该 ref 的运行记录 outcome === undefined）、onSourceStage（req.status === 来源阶段，来源阶段由 src/domain/gate/GateCatalog.ts 的 ARTIFACT_CONFIRM_GATES 反查得到，不另写映射表）；② applyConfirmDecision 入口先算前提，gateOpen===false 或 onSourceStage===false 时返回 {success:true, confirmed:false, advanced:false, note:'该确认已被取代（或需求已推进到 <status>）：本次作答不改变状态'} 并调 recordStaleAnswer 留一条评论，不落章、不推进、不抛；③ 落章写入改为「仅当为空时写」：plan.approvedAt / 产物 confirmedAt / approvedEvidence / confirmedEvidence；④ 新增 recordStaleAnswer（与 recordDeclinedConfirmation 同址），只写评论不碰台账时间戳。
      serves:
        - FR-4
        - FR-5
      depends_on:
        - t-aa311c
      phase: implement
      side: backend
    - id: t-34a881
      title: 迟到作答路由到中性通道（不落章不推进）
      implements: 改 src/application/internal/pending-confirm.ts::suspendConfirm 的后台续跑：作答到达时先判定该 ref 是否已被 settle（outcome !== undefined）或需求是否已离开该门的来源阶段；命中失效条件时调 recordStaleAnswer 返回中性体（confirmed=false + 说明），不再调 settleAnswers/applyConfirmDecision；否则走原路径逐字不变。同步修正 outcomeOf 回填语义（失效票不写 confirmed=true）。
      serves:
        - FR-5
      depends_on:
        - t-ac6dbe
      phase: implement
      side: backend
    - id: t-51ccb8
      title: 指南三处与回执 note 去机制化并重生成产物
      implements: ① 改 src/application/internal/capture-section.ts 的设计/拆分两处指南为条件式：「若回执已说明有门在等 → 不要重复发起确认；否则发起一次」。② 改三份片段 src/domain/prompt/fragments/decomposing/light.md、src/domain/prompt/fragments/decomposing/heavy.md、src/domain/prompt/fragments/brainstorming/heavy/overrides.md 同样条件式。③ 跑 node scripts/inline-prompt-fragments.mjs 重生成 src/domain/prompt/generated/fragments.ts。④ 改 src/application/use-cases/SubmitArtifact.ts 的回执 note 分支：triggered=true 时写「已有一道门在等（ticket=…）：取回执或看板作答，不要再发起确认」，不再指向 ask_confirm。⑤ 同步 tests/fixtures/stage-prompts-baseline.json 基线。
      serves:
        - FR-3
      depends_on:
        - t-989d03
        - t-aa311c
      phase: implement
      side: backend
    - id: t-610324
      title: recovery 与拒绝文案删掉“覆盖”措辞
      implements: 改 src/application/internal/pending-guard.ts::pendingConfirmRejectMessage 的 recovery 清单：删掉「③ 重新发起 reqboard_ask_confirm 覆盖旧记录」，改为「已有一道门在等：① 调 reqboard_confirm_receipt 取回执 ② 到项目看板作答」；连带核对 QueryState 投影里同一份文案的来源（共用同一判据，不另写一份）。
      serves:
        - FR-3
      depends_on:
        - t-aa311c
      phase: implement
      side: backend
    - id: t-33a14b
      title: 补 U1~U9 用例与“同门唯一”探针
      implements: 在 tests/gate-request-uniqueness.test.ts 补齐 U1~U9（真 fs + 真工具壳）：U1 同门连调两次、U2 连调三次幂等且不续期、U3 已批准再调早退、U4 异门清理、U5 跨窗口复用、U6 已批准后再落章首写不变、U7 需求已推进后作答、U8 被取代门迟到作答、U9 status 投影读门状态。探针：在 scripts/gate-inflight-probe.mts 输出「当前在等的门」清单（ref / target / createdAt / 谁能答）并断言同门计数 ≤1。
