  title: API 边界收敛：/state 的 tasks / ready / 计数全部按活卡下发
  status: done
  implements: "改 `src/http/routers/stages.ts`（**出口清单逐条接线，客户端不再各写过滤**）：① `handleState`：`const live = liveTasksOf(await taskStore.listAll())`，`tasks: live.map(t => ({ ...t }))`（不再下发取消卡）；`ready` 改由 `isReadyTask` / `liveReadyTasks` 派生（**现算、不读落盘 `ready[]`**，保留既有「输出顺序=任务数组顺序」的 R-3/D8 口径与既有注释）；② 同文件需求摘要计数（`tasksTotal` / `percentage` 处）：`tasksTotal = liveCountOf(tasks)`、`percentage` 用同一活卡分母（`done`/`active` 走既有 helper，不新造计量粒度）；③ 同文件会话流程面板：`progress.total` / `byStatus` / `tasks` 全部按活卡算，`byStatus.canceled` 恒 0 且**不新增**「另有 N 张」字段或文案（D-7）；④ 同文件节点详情/总览装配处：传入活卡集合。改 `tests/state-payload-client.test.ts`：补含取消卡标本的断言（出参 tasks / ready / tasksTotal / percentage 四处）。验证命令见 acceptance。依据 design/interfaces.md §4.1 落点 3 与 backend.md §出口清单。"
