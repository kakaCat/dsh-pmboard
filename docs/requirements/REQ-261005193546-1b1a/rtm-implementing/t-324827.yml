  title: 服务端内部与用例面收编手写活卡 filter（只换判据来源，不改行为）·复核
  status: done
  implements: |-
    把下面每一处**手写活卡 filter** 替换为单点调用（**只换判据来源，不改行为、不改计量粒度**）：`src/application/internal/sheet-tasks.ts`（验收单投影）、`src/application/internal/content-trace.ts`（追溯投影）、`src/application/internal/verification-doc-writer.ts`（验收文档渲染）、`src/application/internal/backfill-task-refs.ts`（回填引用）、`src/application/use-cases/SubmitVerification.ts`（四处：探针、跳过守卫、ledger 取数、落盘取数——落盘那处正是「文件写 106」的由来，探针与落盘必须同分母）、`src/domain/workflow/RollupSpec.ts` 的 `activeTasksOf`（domain→domain import 合法）。**不收编**语义不同的守卫/写侧点（`advance-select.ts` / `Decompose.ts` / `AdvanceChain.ts` / `rollback-tasks.ts` 等）：它们属基线，且「已取消就跳过」的 `continue` 守卫要保持行为逐字不变。新增 `tests/canceled-internal-collect.test.ts`：对同一标本断言各收编点输出都不含取消卡，且 `SubmitVerification` 的探针与落盘**同分母**（106）。验证命令见 acceptance。依据 design/backend.md §断言域文件清单与 §出口清单。

    [子卡阶段·复核] 只做本阶段；验收：对照 `docs/requirements/<REQ>/design/` 逐条核对；`npx vitest run <相关测试文件>` → 全绿；无偏离时显式写明「无偏离」及依据
