  title: 新增对比度报表脚本（读 report.ts 令牌声明）
  status: done
  implements: 新增 scripts/req-detail-ui-contrast.mts：从 src/client/styles/report.ts 的令牌声明解析色值（不复制一份值），按 WCAG 相对亮度公式打印「用途 / 色值 / 背景 / 实测比值 / 判定」全表；覆盖三类关系——① 深字压白底（text 16.9、text2 5.07、ok 5.14、teal 4.89、danger 5.38、warn 5.28、accent 4.70）；② 组合背景（12% 同色浅底 + 文字：若某处仍留底色块则启用 --pm-ok-text-tint 4.55 / --pm-teal-text-tint 4.52 / --pm-danger-text 4.52 并重测）；③ 反白关系（白字压 --pm-accent 主按钮底 4.70）；非文本档 ≥ 3:1（图标、进度条完成与当前段、状态带左边色条、焦点环、缺口严重度标记）；豁免逐条登记并给理由（--pm-line 1.25、--pm-line-strong 1.45、未开始阶段段 1.24）；报表里出现 [data-ds-dark-theme] 对详情页的任何影响即判失败；退出码 0/1/2 语义与既有探针一致。基线全表见 evidence/contrast-baseline.txt。
