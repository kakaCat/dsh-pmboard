  id: t-57082b
  title: 探针新增可访问性断言组（焦点环/目标尺寸/最小字号/reduced-motion/阶段条标记）·研发
  status: done
  implements: |-
    改 scripts/req-report-probe.mts（A1～A6 与 readbackProblems() 口径不动）新增断言组，每条打印实测值、失败即退出码 1：A7 焦点环（清单控件 el.focus() 后 outlineWidth ≥ 2px、outlineColor 与背景 ≥ 3:1、outlineOffset = 面状 -2px 或小控件 2px，浅深两套主题各一次）；A8 目标尺寸与间距（遍历 button/[role=tab]/a[href]/summary/input，命中区 ≥ 24×24、相邻 ≥ 8px，例外清单显式写在断言里逐条给理由）；A9 最小字号与档位（可见真文字最小 ≥ 11px、档位集合 ⊆ {11,12,13,15,20,24} 且无阶梯外字号，按可见性排除 sr-only）；A10 reduced-motion（计算 transitionDuration = 0s）；A11 阶段条/缺口/结论的非颜色标记（元素内存在文本或 svg 子节点）；A12 H1～H5 与 D-8 三条几何（actionRowTop < identityRowTop 且差 ≥ 8px、windowLeft < createdAtLeft）；A13 五块面板补测（TC-28 与验收标准 #4c）：扩展 scripts/fixtures/req-detail-specimen.mts 补五块载荷，逐块量目标尺寸、字号档、结构位 emoji 并逐块打印。

    [子卡阶段·研发] 只做本阶段；验收：`npx vitest run <本卡改动涉及的测试文件>` → 全绿；并附 `git diff --stat` 摘要
