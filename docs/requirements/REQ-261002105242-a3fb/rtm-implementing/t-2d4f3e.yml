  title: 定死终态投影与归档条渲染契约（纯函数 + 复活既有 CSS）·研发
  status: done
  implements: |-
    src/client/views/board.ts：把现有 toReqCards 的 map 体内联逻辑抽成私有 toCard(state, req)（字段口径与 src/client/types.ts 的 ReqCard 一致），toReqCards 改为 filter(status ∉ {archived, canceled}).map(toCard)（签名与语义不变）；新增 export toTerminalCards(state)：filter(status ∈ {archived, canceled}).map(toCard) + 按 updatedAt 降序；新增 export const ARCHIVED_CHIPS_MAX = 100 与 export renderArchivedBar(cards, limit = ARCHIVED_CHIPS_MAX)：空数组返回 ''，否则输出 <div class="dsh-pm-archived-bar" data-archived-bar data-archived-count=N><details class="dsh-pm-archived-fold">（无 open 属性）<summary class="dsh-pm-archived-label">🗄 已归档 A[ · 已取消 C]（点击展开回看 DAG / 任务）</summary><div class="dsh-pm-archived-chips">…chip 为 <button type="button" class="dsh-pm-archived-chip" data-action="open-req" data-req data-status title>…</button>，内含 <span class="dsh-pm-archived-count">done/total</span>…</div></details></div>，超限追加「另有 N 条未显示」，id/标题一律 esc()。src/client/styles/base.ts 归档条区段补四条规则：.dsh-pm-archived-fold、.dsh-pm-archived-chips（flex wrap + gap）、.dsh-pm-archived-chip 的 button reset（border:0; cursor:pointer; font:inherit）+ :hover、.dsh-pm-archived-count；既有 .dsh-pm-archived-bar/-label/-chip 选择器不动。新建 tests/archived-entry.test.ts 铺 A1-1/A1-3/A1-4/A6（构造 BoardState 字面量，纯字符串断言）。本卡不接线 buildBoard/buildListView，不碰详情页。

