  title: 实现 reqboard_submit(kind=prototype) 登记编排与豁免留痕
  status: done
  implements: "改 src/application/use-cases/SubmitArtifact.ts：增 kind='prototype' 分支——① assertArtifactOpenable 按需求目录相对口径归一路径（伪路径/越界即拒）；② kindForRelPath 必须判为 prototype，旧 prototype/*.html 仍识别并在消息里提示迁移到 prototypes/；③ parsePrototypeMetadata 抽锚点与几何量（geometry JSON 坏按缺块记录，不抛；登记不阻断）；④ registerArtifact 幂等（stage+kind+path 去重）并写 StageArtifact.prototypeMeta；⑤ triggerAutoConfirm 请人确认（门禁只要求已登记，确认章为可选加强）；⑥ syncRTMYaml('submit:prototype', {paths}) 失败只 warning。改 src/tools/SubmitTool/SubmitTool.ts：kind 入参含 'prototype'（SUBMIT_KINDS 已含）与可选 path（缺省扫 docs/requirements/<REQ>/prototypes/*.html），返回体增 registered_count 与逐份 prototypes[]（name/path/on_disk/registered/confirmed/exempted/authoritative/superseded_by/serves/anchors/geometry）与 blockers，失败不谎报成功。豁免生效时按 prototypeExemptOf 写一条需求评论 [豁免] <理由>（与 design_exempt 同款），且登记只校验不改写 INDEX。依据 design-brief §1 与 §10 #7/#9/#13/#41。"
