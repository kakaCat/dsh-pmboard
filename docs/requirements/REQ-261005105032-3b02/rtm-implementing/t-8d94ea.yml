  title: 三条注入通路带上原型与 D-x（回合指令/节点输入包/子卡提示词）·研发
  status: done
  implements: |-
    ① 改 src/application/dive/round-state.ts 的 renderDiveRoundText：brainstorming 回合提『裁定落账 + 交原型』，design 回合提 frontend.md 与原型锚点，implementing 回合提本卡锚点与 D-x 指针。② 改 src/application/internal/node-input-package.ts：NodeInput 增可选 prototypeRefs?: string[] 与 decisions?: string[]，渲染在『证据指针』节两行；IsolateNodeContext 与 handoff 底稿同源复用，保证遗弃上下文后新窗口只看输入包也能看到原型与裁定。③ 改 src/application/use-cases/ExecuteTask.ts 的 buildSubtaskPrompt：新增内容渲染为三个小节标题（非 JSON 字段）——【本卡原型（UI 卡）】（只 UI 卡：权威原型路径 + 本卡锚点）、【本卡裁定（D-x 原话）】（所有卡：按编号从 requirement 的 D-x 表逐条取原话，不概括、不重写）、【验收判据】；原型路径取 INDEX 权威版本，不取『目录里第一个 html』。依据 design-brief §7 与 §10 #12/#15/#36。

    [子卡阶段·研发] 只做本阶段；验收：`npx vitest run <本卡改动涉及的测试文件>` → 全绿；并附 `git diff --stat` 摘要
