        - t-cf8f13
      phase: implement
      side: backend
    - id: t-c7fbea
      title: 实现裁定记录门与会话留痕判据（decision-gates.ts）
      implements: "新建 src/application/internal/decision-gates.ts（≤400 行），导出 checkDecisionLogGate(docs, req) 与 hasDecisionTrace(sessionProbe, req, opts?)。门禁：找节名逐字 '## 讨论与裁定记录（D-x）'（仅 feature 需求要求该节，D-12）；缺节 → decision_log_missing；节内表格按五列 编号|原话来源|裁定|影响 FR|判据 逐行校验，任一列空或『影响 FR』未命中 extractClauseDefinitions 的真实条款 → decision_entry_invalid 且 gaps 逐条点名条目编号（不是修一条报一条）；编号 D-\\d+ 连续且唯一（复用 checkClauseSequence 思路，独立命名空间；跳号与重复都拒）；整节只写「本节无裁定」视为真空态、不视为空节、放行。留痕：hasDecisionTrace 复用两条读法（快照事件优先、持久化冷读回落），只取 source.kind==='user'，只扫最近 200 条（opts.limit 可覆写），命中祈使词表 改成/不要/必须/加上/应该是/记得/注意/别/要 即视为存在留痕；该启发式只用于『要求本节非空』，不判条目内容、不承诺召回率可测（召回由 G2 人评审承担）；并断言不新增数据源。依据 design-brief §3 与 §10 #16/#20/#23/#24。"
      serves:
        - FR-8
        - FR-9
      depends_on:
        - t-38e966
        - t-cf8f13
      phase: implement
      side: backend
    - id: t-d3a261
      title: 加唯一 async 门禁入口 contentGatesForMove 并接线四条转移路径
      implements: "改 src/application/internal/content-gate-wiring.ts：新增唯一的 async helper contentGatesForMove(docs, req, from, to)，内部按 (from,to) 分派——brainstorming→design 依次跑 checkPrototypePresenceGate → checkPrototypeVersionGate → checkPrototypeAnchorsGate → checkDecisionLogGate，短路返回首个 GateFailure；其余转移与非 UI（sides 不含 frontend）或非 feature/refactor 需求返回 undefined。四条路径在同步门之后调用它：① src/application/use-cases/MoveRequirement.ts（assertArtifactGates 之后、G2 判定之前）；② src/application/use-cases/AskConfirm.ts 的推进块（新增接线，失败 → advanced:false + 门消息）；③ src/http/routers/requirements.ts 的 handleReqMove（preGate 之后、g2CompletenessFailure 之前，mutate 内复查）；④ src/application/use-cases/ConfirmArtifact.ts（advanceTargetFor 命中且未显式关闭推进时，失败 → advanceNote 追加门消息、不推进）。不动同步单点 assertArtifactGates 的签名与职责，不合并既有 G2 调用。回归写成一个文件 tests/move-gate-paths.test.ts：对四条入口各断言一次，且同时断言既有 G2 仍生效；逐条注释掉任一调用点该用例必须红。依据 design-brief §2 与 §10 #22/#46。"
      serves:
