      implements: "改 src/application/internal/artifact-gates.ts：GateFailure.code 联合追加 prototype_missing / prototype_version_conflict / prototype_anchor_missing / decision_log_missing / decision_entry_invalid / verification_prototype_compare_missing / stage_gate_overdue 七个码（不新增门禁函数）。改 src/application/internal/gate-feedback.ts：GATE_HOW_ANCHOR 扩为 /reqboard_[a-z_]+|templates\\/|design_exempt|prototype_exempt|decision_/（实测 prototype_exempt 单独出现不命中旧正则）。改 src/http/envelope.ts：STATUS_BY_CODE 逐条登记上述 7 码 = 400（漏登记会如实落 500，看板显示成服务器坏了）。改 src/application/use-cases/MoveRequirement.ts：transportCodeOf 由隐式推导改显式映射表——prototype_missing→REQBOARD_MISSING_PROTOTYPE、prototype_version_conflict→REQBOARD_PROTOTYPE_VERSION_CONFLICT、prototype_anchor_missing→REQBOARD_PROTOTYPE_ANCHOR_MISSING、decision_log_missing→REQBOARD_DECISION_LOG_MISSING、decision_entry_invalid→REQBOARD_DECISION_ENTRY_INVALID；未知内部码原样透传，不得静默降级为 MISSING_ARTIFACT。依据 design-brief §2 与 §10 #35/#38/#39/#40/#43/#44。"
