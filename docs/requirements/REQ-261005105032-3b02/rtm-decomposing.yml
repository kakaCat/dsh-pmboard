    - id: t-cf8f13
      title: 扩编号白名单（D-\d+）与台账新可选字段契约
      implements: "改 src/application/internal/content-gates.ts：ID_PATTERN 交替里新增一支 D-\\d+（与既有 D-[A-Z]+-\\d+ 共存、互不冲突）；新增纯导出函数 stripPrototypeAnchors(text)，把 \\S+#FR-\\d+ 形态替换为固定 token <proto-anchor>，并在 extractServesFrom 与 serves 抽取入口前置调用（锚点不计 serves，堵假引用）。改 src/shared/protocol.ts：StageArtifact 增可选 prototypeMeta?: { anchors: {fr: string; selector: string}[]; geometry: {name: string; value: number; unit: 'px'|'count'|'ratio'; at: {width: number; state: 'inflight'|'terminal'}; source?: 'prototype'|'human'}[] }；TaskRecord 增可选 prototypeRefs?: string[] 与 decisionRefs?: string[]。三个新键一律加性变更、零迁移：旧记录缺键=未采集，不补齐、不改写、无迁移脚本，旧读取路径与旧形状不变。依据 design-brief §4 与 §10 #6/#36/#41/#49/#50。"
