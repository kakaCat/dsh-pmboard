outputs:
  tasks:
    - id: t-061b26
      title: 把数据放哪、长什么样定成纯函数：路径、摘要、日志行
      implements: 新增 3 个零 I/O 纯函数模块：① src/domain/requirement/ReqboardPaths.ts —— 数据根 / 热分片目录 / 7 个文件名（record.json、comments.jsonl、history.jsonl、artifacts.json、plan.json、verification.json、archive.json）/ 冷存目录的单一事实源，导出常量与 root、requirementDir、recordPath 等拼接函数，禁止 import node:；② src/domain/requirement/RequirementSummary.ts —— RequirementSummary 类型 + summarize(record) 投影（字段集见 design/data-model.md 的摘要投影节：id/title/status/category/blocked/paused/autoRun/createdAt/updatedAt/sourceSessionId/promptDifficulty/workspaceRoot/docBasePath/version/commentCount/artifactCount/advanceAlert）；③ src/domain/requirement/Journal.ts —— 日志行 encode/decode（comments 与 history 两种行）与 truncateByCount(lines, count) 有效前缀计算。配单测 tests/reqboard/domain-paths.test.ts、domain-summary.test.ts、domain-journal.test.ts。
      serves:
        - FR-3
      depends_on: []
      phase: implement
      side: backend
    - id: t-ccddb3
      title: 先定契约：需求存储端口与错误码（与旧端口并存）
      implements: 在 src/application/ports.ts 内**新增**（不删旧 ReqboardRepository，切换在 t8）：RequirementStore 端口（get/getSummary/listSummaries/listComments/listHistory/head/create/mutate/mutateIf/appendComment/sweep/replaceAll/subscribe + peekSummaries）与支撑类型 RequirementFilter/LedgerHead/MutateResult/SweepResult/RequirementChange/MutationOutcome/RequirementDraft/RequirementReader；新增错误码常量（REQBOARD_CONFLICT/NOT_FOUND/ALREADY_EXISTS/COLD_IMMUTABLE/VALIDATION_FAILED/CORRUPT_SHARD/IO_FAILED）。签名逐条照 design/interfaces.md 抄；注释写明三条纪律：mutate 的原子性由适配器保证、sweep 仅启动对账可用、peekSummaries 非权威。在 tests/application/harness.ts 新增 InMemoryRequirementStore（与既有 InMemoryRepo 并存），并写 tests/reqboard/store-contract.test.ts 契约清单（覆盖全部方法与全部错误码，先只跑内存替身）。
      serves:
        - FR-1
        - FR-5
        - FR-6
      depends_on:
        - t-061b26
      phase: implement
      side: backend
    - id: t-712345
      title: 一处原子写、一处分片 IO：仓储与原子写搬迁
      implements: ① 新增 src/repositories/atomicWrite.ts，把 persistAtomic（temp → fsync → rename）从 src/adapters/JsonLedgerRepository.ts 原样迁出（保留临时文件名与同文件系统语义），JsonLedgerRepository 与 QueueRepository 改从此处 import——全仓只留一处实现；② 新增 src/repositories/RequirementShardRepository.ts：分片目录 IO 唯一入口，方法 readRecord/readJournal/readObject、writeRecordAtomic/writeObjectAtomic/appendJournal（追加前按计数截断未提交尾行）、moveToCold/moveFromCold、listHotIds/listColdIds、坏文件改名隔离（<file>.corrupt-<ts> + onWarn）；fs 能力经构造参数注入（供写/读探针接入），结构校验先于任何写。配 tests/reqboard/shard-repository.test.ts。
      serves:
        - FR-1
        - FR-2
      depends_on:
        - t-061b26
      phase: implement
      side: backend
    - id: t-8b1507
      title: 读得动：内存索引、摘要投影、归档冷读
      implements: 实现 src/repositories/ShardedRequirementStore.ts 读侧（implements RequirementStore）：① 懒建内存索引 Map<id, RequirementSummary>（首次 listSummaries/getSummary 未命中时扫 requirements/*/record.json；负结果不缓存；沿用 QueueTaskStore.buildIndexFromDisk 先例，不在构造期预读）；② get（装配全文，热侧未命中回落 archive/ 冷读）、getSummary、listSummaries（scope active|archived|all + ids/status/workspaceRoot/sourceSessionId/limit/cursor）、listComments(since/limit)、listHistory(limit)、head()；③ peekSummaries() 同步投影（非权威，注释写明只允许提示词与引导组装使用）；④ 损坏分片从索引剔除 + onWarn，不抛整页错。把该实现接入 store-contract.test.ts 作为第二个实现。
      serves:
        - FR-1
        - FR-4
        - FR-6
      depends_on:
        - t-ccddb3
        - t-712345
      phase: implement
      side: backend
    - id: t-088a96
      title: 写得准：乐观锁、差异分派落盘、日志追加与截断
      implements: 实现 ShardedRequirementStore 写侧：① create（建目录 → record.json → 首条评论 → meta.json revision+1 → 广播）、mutate（临界区 RMW，进程内串行队列 + 写前重读）、mutateIf（version 比对，不匹配抛 REQBOARD_CONFLICT 带 currentVersion）、appendComment、sweep（仅启动对账）、replaceAll（仅迁移）、subscribe；② draft 惰性装配（外置对象只在变更器实际访问时读）；③ dirty-field dispatch：标量/dive/advance 锁字段/tokenUsage/interruption/docSyncPending 变化 → 原子写 record.json；comments 与 history 尾部增长 → 先 appendJournal 再写 record.json（提交点），计数 +1；artifacts/plan/verification/archive 变化 → 整份原子写对应文件；全无变化 → 不写盘；④ version 一律由适配器 +1（变更器不碰）；⑤ 冷侧写抛 REQBOARD_COLD_IMMUTABLE；⑥ 只追加纪律违反（前缀被改写）→ 整份重写 + onWarn；⑦ 写放大超阈值 onWarn。
      serves:
        - FR-2
        - FR-3
        - FR-4
        - FR-5
        - FR-6
      depends_on:
        - t-8b1507
      phase: implement
      side: backend
    - id: t-39d65f
      title: 数据搬家：v9 单册迁到 v10 分片（可试跑、可幂等）
      implements: 新增 scripts/migrate-ledger-v10.ts，沿用既有 scripts/migrate-ledger.ts 的四模式与安全约定（--dry-run 缺省 / --apply / --verify / --rollback、--json 报告、写前 copyFileSync 备份、<ledgerDir>/state/server.pid 存活时拒绝 --apply、--force 跳过、--out 指定数据根）；导出 readV9Ledger()（供 t7 复用）与迁移主流程：读单册 → 逐需求落分片（comments 按原数组顺序赋 seq、statusHistory 与 advance.history 分 kind 落 history.jsonl、外置对象不存在则不建文件、status 属于 {archived,done} 者落 archive/）→ 最后写 meta.json（schemaVersion 10 + migrations 留痕 {from:9,to:10,at,by}）；带非空 tasks 的旧单册拒绝并指向既有 v9 脚本；无法装配的需求跳过并计入报告（不静默丢）。配 tests/reqboard/migrate-v10.test.ts。
      serves:
        - FR-8
      depends_on:
        - t-088a96
      phase: implement
      side: backend
    - id: t-95212b
      title: 退路先修好：v10 分片导回 legacy v9 单册
      implements: 新增 scripts/rollback-ledger-v10.ts：读 v10 数据根（热侧 + 冷侧 archive/）→ 用 t6 导出的 readV9Ledger 的反向写入器组装 v9 单册结构（comments/statusHistory/artifacts/plan/verification/archive 全部重新内联，schemaVersion 写 9，去掉 v10 才有的计数字段）→ persistAtomic 写 --out 目标；支持 --dry-run/--apply/--json/--force 与写前备份既有目标文件。配 tests/reqboard/rollback-v10.test.ts：迁移夹具 → 回滚导出 → 用 readV9Ledger 装载导出文件做等价断言。
      serves:
        - FR-8
      depends_on:
        - t-39d65f
      phase: implement
      side: backend
    - id: t-912d82
      title: 一次性把运行时切过去：删单册实现、改 95 处读点与三处同步缝
