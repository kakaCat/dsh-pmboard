    - id: t-717ad8
      title: 写得准：乐观锁、差异分派落盘、日志追加与截断·研发
      implements: |-
        实现 ShardedRequirementStore 写侧：① create（建目录 → record.json → 首条评论 → meta.json revision+1 → 广播）、mutate（临界区 RMW，进程内串行队列 + 写前重读）、mutateIf（version 比对，不匹配抛 REQBOARD_CONFLICT 带 currentVersion）、appendComment、sweep（仅启动对账）、replaceAll（仅迁移）、subscribe；② draft 惰性装配（外置对象只在变更器实际访问时读）；③ dirty-field dispatch：标量/dive/advance 锁字段/tokenUsage/interruption/docSyncPending 变化 → 原子写 record.json；comments 与 history 尾部增长 → 先 appendJournal 再写 record.json（提交点），计数 +1；artifacts/plan/verification/archive 变化 → 整份原子写对应文件；全无变化 → 不写盘；④ version 一律由适配器 +1（变更器不碰）；⑤ 冷侧写抛 REQBOARD_COLD_IMMUTABLE；⑥ 只追加纪律违反（前缀被改写）→ 整份重写 + onWarn；⑦ 写放大超阈值 onWarn。

        [子卡阶段·研发] 只做本阶段；验收：`npx vitest run <本卡改动涉及的测试文件>` → 全绿；并附 `git diff --stat` 摘要
