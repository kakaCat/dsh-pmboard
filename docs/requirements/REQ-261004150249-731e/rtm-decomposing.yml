      depends_on: []
      phase: implement
      side: backend
    - id: t-3e8cec
      title: 交接写原子化：席位升降 + sourceSessionId + 留痕
      implements: 新建 src/application/internal/handoff-write.ts：handoffOwner(req, { toWindow, fromWindow, actor, at, commentId, reason }) 在一次 mutate 内完成 ① 新窗口入席 owner ② 原窗口（若有席位）降 observer ③ req.sourceSessionId = toWindow ④ 追一条留痕评论（from→to、角色变化、reason）。前置校验：当前 owner 必须等于 fromWindow（并发保护）、toWindow ≠ fromWindow、不得产出空 owner（INV-1）；席位与 sourceSessionId 必须同指一窗（INV-2）。幂等：三处都已对 → 返回 changed=false，不新增评论。
      serves:
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-ee8599
      title: 分叉判据纯函数（三档 + 读数缺席不猜）
      implements: "新建 src/application/internal/handoff-policy.ts：decideHandoff(pressure: ContextPressureSnapshot | undefined, cfg: { warn; fork; critical }) → 'none' | 'warn' | 'fork' | 'critical' | 'unknown'。ratio = pressureTokens / contextWindow，仅当两者都在场且 source === 'projection' 才可算；任一缺席 → 'unknown'（绝不补 0；projectedTokens=0 是合法读数）。零 IO、零 node: 依赖（C-01）。配套新建 tests/handoff-policy.test.ts 覆盖六点边界与缺席分支。"
      serves:
        - FR-3
      depends_on: []
      phase: implement
      side: backend
