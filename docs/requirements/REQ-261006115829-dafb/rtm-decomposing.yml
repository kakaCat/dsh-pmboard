outputs:
  tasks:
    - id: t-e6d1e3
      title: 写排查条目页并落实判据契约
      implements: |-
        新建 docs/guides/plugin-reload-troubleshooting.md，按 design/interfaces.md 的条目页骨架写五段 H2：症状 / 判据 / 机制 / 处置 / 非目标。
        症状段：照抄两条红字原文形态——一条是插件包地址 404（形如 dsh-app://app/plugins/??<包>/client.js&rev=<rev>），另一条是 dsh-app://app/plugins/events 的 net::ERR_FAILED；写明两条成因不同。
        判据段：写 design/interfaces.md 的 C-1 / C-2 / C-3 三条命令；端口与 rev 一律写 <host> / <rev> 占位并注明「逐次实测取值」；每条给期望输出与不符时的分诊一句话。
        机制段：宿主按入口产物的 mtime / ctime / size 合成 rev，重建即让旧 rev 失效（旧地址 404）；/plugins/events 是 @deepseek-ai/dsh-client-hmr 的 SSE 通道，宿主重启或页面卸载即断，EventSource 自动重连；桌面壳只把 / 、/index.html 、/assets/** 、/favicon.svg 、/manifest.webmanifest 当静态文件，其余路径一律转发宿主。
        处置段：先刷新页面；仍红则取证（DevTools → Network 按状态码筛 404，保留完整 URL）并交回排查。
        非目标段：非包地址的 404、宿主不可达、无 rev 的地址，各自去哪查。
      serves:
        - FR-1
        - FR-3
      depends_on: []
      phase: doc
      side: doc
    - id: t-4c36ac
      title: 两处入口回链（说明书索引 + 运行前提页机制一句）
      implements: |-
        1. docs/architecture/project-manual.md 的索引区新增一行：现象（控制台出现插件包 404 / plugins/events ERR_FAILED）→ 条目相对链接 ../guides/plugin-reload-troubleshooting.md；只增行。
        2. docs/architecture/plugin-runtime-prerequisites.md 的「二、构建产物 ≠ 已加载模块」节末尾追加一句机制（包地址带 rev，宿主只服务当前 rev，过期即 404）+ 指向条目的链接；不是裸链接，只追加。
        3. 不改两页既有结论、表格结构与标题层级。
      serves:
        - FR-2
      depends_on:
        - t-e6d1e3
      phase: doc
      side: doc
    - id: t-890bc5
      title: 判据实测定标并把读数回写条目与用例表
      implements: |-
        1. 取交付当日实测值：<host>（本机为桌面宿主端口）与当前 rev（从 /plugins/events 的图帧里抄 dsh-pmboard/client.js&rev=…）。
        2. 依次跑 C-1 / C-2 / C-3，把状态码与响应字节回写两处：docs/guides/plugin-reload-troubleshooting.md 的期望输出、design/test-cases.md 的 TC-3 定标表。
        3. 跑 TC-1 / TC-2 / TC-4 的断言命令并留输出。
        4. 跑 pnpm kb:check；若因新增页面出现漂移，按 C-13 先 pnpm kb:build 再复核。
        5. 把本次交付的文件清单与命令输出写进任务汇报。
      serves:
        - FR-1
        - FR-2
        - FR-3
      depends_on:
        - t-4c36ac
      phase: test
      side: doc
