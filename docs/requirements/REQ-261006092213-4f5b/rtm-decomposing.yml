  tasks:
    - id: t-3153e8
      title: 建结果匹配纯函数与体检（接口先行）
      implements: 新建 src/domain/workflow/ResultBinding.ts：导出 ResultRefInput / ResultMatchReport / isForeseeableItem / matchStructuredResults / applyStructuredResults；纯函数、零 IO、不读环境变量（回滚开关由调用方读后传参）；ref 与 VerificationItemSource 相等匹配；不匹配 / 漏项 / 重复 / 空值分别归 unmatched / missing / duplicate / invalid。同卡写 tests/result-binding.test.ts 覆盖五类体检。口径逐字照 design/interfaces.md。
      serves:
        - FR-1
        - FR-2
      depends_on: []
      phase: implement
      side: backend
    - id: t-62130a
      title: 提交侧：results 参数 + 逐项交代硬门 + 落结果
      implements: src/tools/SubmitTool/SubmitTool.ts 顶层 properties 声明 results（schema 为 additionalProperties:false，必须显式声明）；src/tools/SubmitTool/prompt.ts 补「逐项交结果、缺项会被拒」文案；src/application/use-cases/SubmitVerification.ts：读 results → 用同一批 liveTargetTasks 算可预见集合（顶层父卡 + 需求级 + 对照项）→ matchStructuredResults → 任一非空即拒（点名到 ref，校验全部在 mutate 之前，台账零变更）→ 组装后 applyStructuredResults；返回体加 results_bound / results_unmatched / results_coverage；tests/accept-sheet-tool.test.ts 加用例。
      serves:
        - FR-1
        - FR-2
        - FR-8
      depends_on:
        - t-3153e8
      phase: implement
      side: backend
    - id: t-3a769a
      title: 裁决口径与底线：零输入通过 / unverified / 放行判据
      implements: src/application/use-cases/AcceptSheet.ts：resultOf 顺序固定为 第2问自填 → 第1问自填 → item.result（去掉 it.evidence[0] 兜底）；finalizeIfAllPassed 放行判据加 unverified（pending 与 unverified 都不放行）；返回体加 unverified。src/domain/workflow/AcceptanceSheetSpec.ts：applyVerdicts 的 passed 校验放宽为「opinion 或 result 非空」，两者皆空记 unverified；failed / not_verifiable / 系统项处置必填规则不变。src/application/internal/verdicts.ts：opinion 非空且 ≠ item.result 时写 result=opinion、resultSource='human'。新增 tests/accept-sheet-zero-input.test.ts。
      serves:
        - FR-3
        - FR-5
        - FR-6
      depends_on:
        - t-3153e8
      phase: implement
      side: backend
    - id: t-8d3c5d
      title: HTTP 逐项裁决口径放宽与来源写入
      implements: src/http/routers/verdicts.ts：删除「passed 且空 opinion → badInput（通过的验收项必须填写实际结果）」的路由层预校验，改由 applyVerdicts 统一判定；响应形状与「任务先、需求后」写入顺序不变；新增 tests/verdicts-http.test.ts。
      serves:
        - FR-4
        - FR-6
      depends_on:
        - t-3a769a
      phase: implement
      side: backend
    - id: t-60a977
      title: 看板逐项行与详情页核验表（预填 + 旗标）
      implements: src/client/stage-panel.ts 的 renderVerificationSheet 增「实际结果（agent 实测 / 人工填写）」行、输入框预填 item.result、needsHuman 旗标（复用 .dsh-pm-flag.verify-pending）、data-result-src 属性；src/client/board-mount.ts 删除 missingOpinion 前端拦截；src/client/styles/board.ts 只扩展样式不另起体系；src/client/views/verification.ts 与 src/client/views/panels/docs.ts 的来源三态与 result 展示对齐。判据照 design/frontend.md 与权威原型三个锚点。
      serves:
        - FR-3
        - FR-4
        - FR-5
      depends_on:
        - t-8d3c5d
      phase: ui
      side: frontend
    - id: t-ee18ef
      title: 迁移与兼容：老写法、回滚开关、存量单据
      implements: "src/domain/workflow/AcceptanceSheetSpec.ts 的 itemResultBindingEnabled 语义写清（关闭 = 不结构化绑定 + 恢复 evidence[0] 兜底）；src/application/use-cases/SubmitVerification.ts 让老写法 evidence 里 `id :: 结果` 未命中的键进 results_unmatched（不再静默），不带 results 时 results_coverage='legacy'；存量在册验收单不回写；tests/verify-item-result.test.ts 在同一文件内断言新旧两种口径。"
      serves:
