    - id: t-cc7233
      title: 注入留痕加 origin/delivered/text 并补三处写入
      implements: 在 src/application/internal/injection-log.ts 扩 InjectionLogEntry，新增 origin（三个枚举值）、delivered、text、truncated；补三处写入点：src/application/gate/handlers/h3-inject.ts（标记 gate-h3，delivered 为真）、src/application/dive/session-driver.ts（标记 dive-node，delivered 为假）、src/adapters/AgentDeliverer.ts 的 createRoundMessage 与 deliverMessage（标记 dive-round，按实际投递结果记成败）。text 超过 8000 字符截断并置 truncated。
      serves:
