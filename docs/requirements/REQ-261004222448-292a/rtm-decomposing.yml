      depends_on:
        - t-361f2f
      phase: implement
      side: backend
    - id: t-43fcf4
      title: 服务端聚合查询：report、docs、dag、token 扩展
      implements: 新增四个查询文件：src/application/query/QueryReport.ts（结论头、操作条、状态带，含 buildGaps 四类判定与 verdictLine）、QueryDocs.ts（文档铺开清单、核验表、门禁裁决留痕、归档）、QueryDag.ts（图数据与每步执行结果，取任务执行记录与最近汇报）、QueryToken.ts（在现有 token 装配上加每次调用均、缓存命中率、优化点、可得性三态）。聚合全在服务端，前端不遍历。
      serves:
        - FR-3
        - FR-4
        - FR-5
        - FR-7
        - FR-8
        - FR-10
      depends_on:
        - t-361f2f
      phase: implement
      side: backend
    - id: t-8eeed9
      title: 会话文本抽取：dialogue 查询与过滤规则
      implements: 新增 src/application/query/QueryDialogue.ts：复用现有 SessionProbeAdapter 的快照事件与持久化冷读两条取数路径；只保留用户消息与助手消息的文本块；排除工具调用、工具结果、推理块、run_code 包裹内容与过程叙述；系统消息由状态事件、断点、交接、挂起确认、验收裁决组装，措辞取台账原文，回填事件带 inferred 标；游标分页默认 20 条。
      serves:
        - FR-6
      depends_on:
        - t-361f2f
      phase: implement
      side: backend
    - id: t-242dd9
      title: 主干抽取：trunk 查询与既有节名匹配
      implements: 新增 src/application/query/QueryTrunk.ts 与纯函数 extractSection：按写死的节名（需求文档的产品定义节与边界节；设计文档的架构节、关键决策与取舍节、技术方案与亮点节）取节内容；七条各返回来源标与摘要，摘要只截原文、不生成新叙述；未命中时标为缺节；亮点里的自动事实由执行记录与产物算出，人写条目证据为空时原样返回空数组。
