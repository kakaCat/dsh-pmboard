      implements: 在 src/shared/protocol.ts 落六端点的响应类型与统一降级信封 Degrade；在 src/application/query/index.ts 导出六个查询用例的签名（仅签名不实现）；在 src/application/ports.ts 确认所需的四个只读端口（需求台账、队列、留痕、会话）。不写任何实现逻辑。
